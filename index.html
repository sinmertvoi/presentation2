<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лендинг vs многостраничный сайт</title>
<style>
:root{--ink:#12224a;--mut:#5a6a92;--card:rgba(255,255,255,.8);--a:#0f9d8a;--b:#6d4aff;--p:#2f4fd0;box-sizing:border-box}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:linear-gradient(135deg,#f4f7ff,#e8f0ff 55%,#eef2ff) fixed;color:var(--ink);font-family:Inter,"Segoe UI",system-ui,sans-serif}
.bl{position:fixed;border-radius:50%;filter:blur(70px);opacity:.5;animation:fl 14s ease-in-out infinite alternate}
.b1{width:420px;height:420px;background:#b9c8ff;top:-120px;left:-100px}
.b2{width:380px;height:380px;background:#a8e6dc;bottom:-120px;right:-80px;animation-delay:-5s}
.b3{width:300px;height:300px;background:#d3c4ff;top:40%;left:55%;animation-delay:-9s}
@keyframes fl{to{transform:translate(60px,40px) scale(1.15)}}
.s{position:absolute;inset:0;padding:calc(34px + env(safe-area-inset-top,0px)) 6vw calc(70px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:center;gap:18px;opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s,transform .7s cubic-bezier(.2,.8,.2,1);overflow:auto}
.s.on{opacity:1;visibility:visible}
.a{opacity:0}
.on .a{animation:up .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*.08s + .1s)}
@keyframes up{from{opacity:0;transform:translateY(34px) rotateX(12deg) scale(.95);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
h1{font-size:clamp(34px,6vw,70px);line-height:1.05;letter-spacing:-.03em}
h2{font-size:clamp(24px,3.6vw,42px);letter-spacing:-.02em}
h1 em,h2 em{font-style:normal;background:linear-gradient(90deg,var(--p),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--p);font-weight:700}
.sub{color:var(--mut);font-size:clamp(15px,1.6vw,20px);line-height:1.5}
.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.c{background:var(--card);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:22px;box-shadow:0 10px 34px rgba(40,70,160,.12);transition:translate .3s}
.c:hover{translate:0 -5px}
.c h3{font-size:19px;margin-bottom:10px}
.c.A{border-top:5px solid var(--a)}.c.B{border-top:5px solid var(--b)}
.c.A h3{color:var(--a)}.c.B h3{color:var(--b)}
.c p,.c li{font-size:clamp(14px,1.4vw,17px);line-height:1.5;color:#36466f}
.c ul{padding-left:18px;display:grid;gap:5px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:#fff;border:1px solid #dbe4ff;border-radius:99px;padding:9px 16px;font-size:15px;transition:.3s}.chip:hover{translate:0 -4px;background:var(--b);color:#fff}
.n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--b));color:#fff;font-weight:700;font-size:14px;margin-bottom:8px}
.shot{display:grid;place-items:center;text-align:center;min-height:60vh;border:2px dashed #8aa0ee;border-radius:22px;background:rgba(255,255,255,.7) center/contain no-repeat;color:var(--mut);padding:16px;cursor:pointer;font-size:15px;transition:.3s}
.shot:hover{border-color:var(--p);background-color:#fff}
.shot input{display:none}.shot.has{border-style:solid;color:transparent}
.cta{display:inline-block;padding:16px 34px;border-radius:99px;background:linear-gradient(135deg,var(--a),#2fc4ad);color:#fff;font-weight:700;font-size:20px;box-shadow:0 10px 30px rgba(15,157,138,.4);position:relative;overflow:hidden;animation:pu 2s infinite}
@keyframes pu{50%{transform:scale(1.06)}}
.flow{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.flow .c{text-align:center;padding:18px 12px}
table{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:clamp(13px,1.4vw,17px)}
th{text-align:left;padding:10px 14px;color:#fff}
th:nth-child(2){background:var(--a);border-radius:14px 0 0 14px}th:nth-child(3){background:var(--b);border-radius:0 14px 14px 0}
th:first-child{color:var(--mut)}
td{padding:12px 14px;background:var(--card)}td:first-child{font-weight:700;border-radius:14px 0 0 14px}td:last-child{border-radius:0 14px 14px 0}
.note{border-left:4px solid var(--p);padding:12px 18px;background:rgba(255,255,255,.85);border-radius:0 14px 14px 0;font-size:16px;line-height:1.5}
a{color:var(--b);word-break:break-all}
#bar{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--p),var(--b),var(--a));width:0;transition:width .5s;z-index:9}
#nav{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);padding:8px 14px;border-radius:99px;box-shadow:0 8px 24px rgba(80,70,150,.15);z-index:9}
#nav button{border:0;background:var(--p);color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
#nav span{font-size:14px;min-width:54px;text-align:center;color:var(--mut)}

.s{transform:translateX(70px) scale(.98)}.s.pr{transform:translateX(-70px) scale(.98)}.s.on{transform:none}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(47,79,208,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(47,79,208,.07) 1px,transparent 1px);background-size:48px 48px;animation:gm 20s linear infinite;pointer-events:none}
@keyframes gm{to{background-position:48px 48px}}
h1 em,h2 em{background-size:200% auto;animation:sh 5s linear infinite}
@keyframes sh{to{background-position:200% center}}
.c{position:relative;overflow:hidden}
.c::after{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(109,74,255,.14),transparent 60%);opacity:0;transition:.3s;pointer-events:none}
.c:hover::after{opacity:1}
.cta::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);animation:sw 2.6s infinite}
@keyframes sw{to{left:130%}}
.n{animation:rg 2.4s infinite}
@keyframes rg{0%{box-shadow:0 0 0 0 rgba(47,79,208,.5)}100%{box-shadow:0 0 0 14px transparent}}
th:nth-child(2){color:#fff}
.sg{display:grid;grid-template-columns:minmax(230px,1fr) 2.4fr;gap:16px;align-items:stretch}
.sg>.col{display:grid;gap:12px;align-content:center}
.g.big{grid-template-columns:1fr 1fr}
.shot{position:relative}
.rp{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:var(--p);color:#fff;display:none;place-items:center;font-size:18px}
.shot.has .rp{display:grid}.shot.has{cursor:zoom-in}
#lb{position:fixed;inset:0;background:rgba(3,8,22,.94);display:none;place-items:center;z-index:20;cursor:zoom-out}
#lb img{max-width:96vw;max-height:94vh;border-radius:12px}
@media(max-width:800px){.sg,.g.big{grid-template-columns:1fr}.shot{min-height:40vh}}
.shot img{display:none;width:auto;max-width:100%;max-height:64vh;border-radius:14px;box-shadow:0 12px 36px rgba(40,70,160,.25)}
.shot.has{min-height:0;border:0;background:none;padding:0;display:flex;justify-content:center;align-items:center;align-self:center;justify-self:center}
.shot.has img{display:block}.shot.has span{display:none}
</style></head><body>
<div class="bl b1"></div><div class="bl b2"></div><div class="bl b3"></div><div id="bar"></div>
<div id="deck"></div>
<div id="lb"><img alt=""></div>
<div id="nav"><button id="pv">‹</button><span id="ct"></span><button id="nx">›</button></div>
<script>
const L=(t,a)=>`<div class="c a A"><h3>${t}</h3><ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
const V=(t,a)=>L(t,a).replace('A"','B"');
const P=(t,x,k)=>`<div class="c a ${k}"><h3>${t}</h3><p>${x}</p></div>`;
const H=(t,x='')=>`<div class="tag a">${x}</div><h2 class="a">${t}</h2>`;
const G=x=>`<div class="g">${x}</div>`;
const SG=(l,s)=>`<div class="sg"><div class="col">${l}</div>${s}</div>`;
const CH=a=>`<div class="chips">${a.map(x=>`<span class="chip a">${x}</span>`).join('')}</div>`;
const S=t=>`<label class="shot a"><span>📌 ${t}<br>(нажмите, чтобы вставить скриншот)</span><img alt=""><input type="file" accept="image/*"><b class="rp">↻</b></label>`;
const sl=[
`<h1 class="a">Лендинг <em>vs</em><br>многостраничный сайт</h1><p class="sub a">Тема: одежда и обувь — бренды, коллекции, индивидуальный пошив</p>${G(P('Лендинг','«Наследие Сибири» — индивидуальный пошив<br><a href="https://sibnasledie.ru/poshiv/individualnyy-poshiv.html">sibnasledie.ru</a>','A')+P('Многостраничный сайт','VERSIYA — интернет-магазин<br><a href="https://versiya.shop/">versiya.shop</a>','B'))}`,
H('Для чего создан <em>каждый из них</em>?','Цель')+G(P('«Наследие Сибири»','Продвижение услуги индивидуального пошива. Рассказать об услуге, показать возможности производства и убедить оставить заявку.','A')+P('VERSIYA','Интернет-магазин одежды и обуви. Каталог товаров, помощь в выборе и оформление покупки.','B')),
H('Что посетителю <em>предлагают сделать</em>?','Действия')+G(L('«Наследие Сибири»',['Ознакомиться с услугой','Выбрать вариант изделия','Обсудить свою идею','Получить расчёт стоимости','<b>Главное: получить расчёт</b>'])+V('VERSIYA',['Выбрать категорию','Открыть карточку товара','Выбрать вариант','Добавить в корзину','<b>Главное: выбрать и купить</b>'])),
H('Структура и <em>навигация</em>','Различия')+G(P('«Наследие Сибири»','Одна длинная продающая страница: предложение → преимущества → виды изделий → процесс → материалы → стоимость → FAQ → заявка. Навигация переносит к разделам этой же страницы.','A')+P('VERSIYA','Иерархия: Одежда → категория → товар → карточка. Отдельные разделы: обувь, сумки, аксессуары, новинки, распродажа.','B')),
H('Почему «Наследие Сибири» — <em>лендинг</em>?','Вывод')+G(L('Признаки',['Одно предложение — индивидуальный пошив','Все блоки работают на одну услугу','Информация идёт последовательно','Посетителя подводят к целевому действию','Основной CTA — расчёт и заявка','Навигация внутри одной страницы']))+`<div class="note a">Нет большого каталога для самостоятельной покупки — продаётся конкретная услуга.</div>`,
H('Оффер <em>лендинга</em>','Слайд 6')+SG(P('Что предлагают','Индивидуальный пошив одежды под клиента: по фото, эскизу, описанию идеи или меркам.','A')+`<div class="note a">Оффер конкретный: сразу ясно, что можно заказать.</div>`,S('Выдели рамкой оффер, подпиши «Оффер»')),
H('Что понятно на <em>первом экране</em>','Слайд 7')+SG(P('Что?','Индивидуальный пошив одежды.','A')+P('Кому?','Тем, кому нужна одежда по своим параметрам или задумке.','A')+P('Зачем?','Изделие специально под человека.','A')+P('Действие?','Получить расчёт и обсудить заказ.','A')+`<div class="note a">Оценка: первый экран справляется хорошо.</div>`,S('Отметь заголовок, описание и CTA')),
H('Основной CTA — <em>«Получить расчёт»</em>','Слайд 8')+SG(`<div class="a"><span class="cta">Получить расчёт</span></div>`+P('Почему подходит','Цена зависит от изделия, материала, сложности и параметров клиента.','A')+P('Почему работает','Сначала расчёт и обсуждение, а не оплата неизвестной суммы.','A'),S('Выдели кнопку яркой рамкой')),
H('Ключевые <em>блоки</em> лендинга','Слайд 9')+G([['Оффер','что предлагает компания'],['Виды изделий','что можно заказать'],['Преимущества','почему стоит выбрать'],['Процесс','как оформляется заказ'],['Материалы','из чего изготовят'],['Стоимость','представление о цене'],['FAQ','ответы на вопросы'],['Форма заявки','ведёт к действию']].map((x,i)=>`<div class="c a A"><span class="n">${i+1}</span><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')),
H('Элементы <em>доверия</em>','Слайд 10')+CH(['Контакты','Информация о производстве','Адрес и связь','Условия работы','Сроки и гарантия','Фото производства','Материалы','Отзывы клиентов','FAQ'])+`<div class="note a">Снижают сомнения и показывают, что за сайтом реальная компания и производство.</div>`,
H('Путь после <em>нажатия CTA</em>','Слайд 11')+`<div class="flow">${['Нажатие «Получить расчёт»','Открывается форма','Указываются данные','Отправка заявки','Связь представителя','Детали, цена, сроки'].map((x,i)=>`<div class="c a"><span class="n">${i+1}</span><p>${x}</p></div>`).join('')}</div><div class="note a">Настоящую заявку отправлять не нужно — достаточно показать путь.</div>`,
H('Удачное решение и <em>недостаток</em>','Слайд 12')+G(P('✓ Удачное решение','Конкретный оффер: сразу ясно, что можно заказать индивидуальный пошив — и по своим параметрам, и по задумке.','A')+P('✕ Недостаток','Много текста и блоков: готовому оставить заявку это может замедлять решение.','B'))+`<div class="note a">Хороший оффер повышает понятность, перегруженность — снижает удобство.</div>`,
H('VERSIYA — <em>многостраничный</em> сайт','Слайд 13')+CH(['Одежда','Обувь','Сумки','Аксессуары','Новинки','Распродажа','Лукбук','О компании'])+G(V('Дополнительно',['Поиск и избранное','Корзина и личный кабинет','Карточки товаров','Магазины, размерная сетка, возврат']))+`<div class="note a">Категории и товары — на отдельных страницах.</div>`,
H('Сравнение <em>двух сайтов</em>','Слайд 14')+`<table class="a"><tr><th></th><th>Наследие Сибири</th><th>VERSIYA</th></tr>${[['Тип','Лендинг','Многостраничный'],['Цель','Заявка на пошив','Продать товары'],['Основное действие','Получить расчёт','Выбрать и купить'],['Структура','Последовательная','Иерархическая'],['Навигация','Разделы одной страницы','Категории и страницы'],['Контент','Убеждает, снимает вопросы','Помогает искать товары'],['Конечное действие','Оставить заявку','Оформить заказ']].map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`,
H('Ссылки и <em>источники</em>','Слайд 15')+G(P('Лендинг','<a href="https://sibnasledie.ru/poshiv/individualnyy-poshiv.html">sibnasledie.ru/poshiv/individualnyy-poshiv.html</a>','A')+P('Многостраничный сайт','<a href="https://versiya.shop/">versiya.shop</a>','B'))+`<div class="note a">Источники: официальные страницы сайтов, их структура и навигация, тексты, кнопки, формы и разделы.</div>`,
H('Лендинг: <em>«Наследие Сибири»</em>','Слайд 16')+S('Оффер, первый экран, CTA, навигация'),
H('Многостраничный сайт: <em>VERSIYA</em>','Слайд 17')+S('Каталог, категории, поиск, корзина, карточка товара')];
const D=document.getElementById('deck');
D.innerHTML=sl.map(x=>`<section class="s">${x}</section>`).join('');
const E=[...D.children];E.forEach(s=>s.querySelectorAll('.a').forEach((e,i)=>e.style.setProperty('--i',i)));
let i=0;
function go(n){i=Math.max(0,Math.min(E.length-1,n));E.forEach((s,k)=>{s.classList.toggle('on',k==i);s.classList.toggle('pr',k<i)});
bar.style.width=(i+1)/E.length*100+'%';ct.textContent=(i+1)+' / '+E.length;location.hash=i+1}
pv.onclick=()=>go(i-1);nx.onclick=()=>go(i+1);
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key))go(i+1);if(['ArrowLeft','PageUp'].includes(e.key))go(i-1)});
D.addEventListener('change',e=>{if(e.target.type=='file'&&e.target.files[0]){const l=e.target.parentNode,u=URL.createObjectURL(e.target.files[0]);l.querySelector('img').src=u;l.dataset.src=u;l.classList.add('has')}});
D.addEventListener('click',e=>{if(e.target.tagName=='INPUT'||e.target.classList.contains('rp'))return;const l=e.target.closest('.shot.has');if(!l)return;e.preventDefault();lb.firstChild.src=l.dataset.src;lb.style.display='grid'});
lb.onclick=()=>lb.style.display='none';
addEventListener('keydown',e=>{if(e.key=='Escape')lb.style.display='none'});
document.addEventListener('mousemove',e=>{const c=e.target.closest&&e.target.closest('.c');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',e.clientX-r.left+'px');c.style.setProperty('--my',e.clientY-r.top+'px')}
document.querySelectorAll('.bl').forEach((b,k)=>b.style.translate=((e.clientX/innerWidth-.5)*(k+1)*50)+'px '+((e.clientY/innerHeight-.5)*(k+1)*50)+'px')});
go((parseInt(location.hash.slice(1))||1)-1);
</script></body></html>
